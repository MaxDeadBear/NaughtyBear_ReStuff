# restuff - ReXGlue Codegen Manifest
#
# Manifest-first project layout (SDK 0.8.1). This single file drives codegen for
# the entrypoint (and any DLL modules). It replaces the old flat
# restuff_config.toml: the former top-level keys now live under [entrypoint], and
# [functions] / [[midasm_hook]] become [entrypoint.functions] /
# [[entrypoint.midasm_hook]].
#
# Run codegen with:  rexglue codegen restuff_manifest.toml
# (or build the `restuff_codegen` CMake target).

[project]
sdk_version = "0.8.0"
name = "restuff"
game_root = "assets"

[entrypoint]
file_path = "assets/Default.xex"
out_directory_path = "generated/default"
includes = []

setjmp_address  = 0x83096C10
longjmp_address = 0x830968F0

[entrypoint.functions]
0x82B3C340 = {}  # ctx.ctr.u32[0]
