# restuff - ReXGlue Codegen Manifest
#
# Manifest-first project layout (SDK 0.8.1). This single file drives codegen for
# the entrypoint (and any DLL modules). It replaces the old flat
# restuff_config.toml: the former top-level keys now live under [entrypoint], and
# [functions] / [[midasm_hook]] become [entrypoint.functions] /
# [[entrypoint.midasm_hook]].
#
# Run codegen with:  rexglue codegen restuff_manifest.toml
# (or build the `restuff_codegen` CMake target).

[project]
name = "restuff"
sdk_version = "0.10.0"
game_root = "assets"

[entrypoint]
file_path = "assets/Default.xex"
out_directory_path = "generated/default"
includes = []

setjmp_address  = 0x83096C10
longjmp_address = 0x830968F0

[entrypoint.functions]
0x827B9630 = {}  # ctx.ctr.u32[0]
0x827788D0 = {}  # ctx.ctr.u32[0]
0x827B9610 = {}  # ctx.ctr.u32[0]
0x824508F0 = {}  # ctx.ctr.u32[0]
0x828BE9A8 = {}  # ctx.ctr.u32[0]
0x827960F8 = {}  # ctx.ctr.u32[0]
0x828816C8 = {}  # ctx.ctr.u32[0]
0x827B9620 = {}  # ctx.ctr.u32[0]
0x828FBDD8 = {}  # ctx.ctr.u32[0]
0x827B9640 = {}  # ctx.ctr.u32[0]
0x82913CA8 = {}  # ctx.ctr.u32[0]
0x82E9D390 = {}  # ctx.ctr.u32[0]
0x8296A4C0 = {}  # ctx.ctr.u32[0]
0x82B50C38 = {}  # ctx.ctr.u32[0]
0x82EA95B8 = {}  # ctx.ctr.u32[0]
0x827ECCF0 = {}  # ctx.ctr.u32[0]
0x8312A720 = {}  # ctx.ctr.u32[0]
0x82D896F0 = {}
0x82D62160 = {}
0x82D5AC18 = {}
0x82E8D260 = {}
0x829E6568 = {}
0x829E6018 = {}
0x82F05978 = { parent = 0x82F054C8 }
0x82F05A18 = { parent = 0x82F054C8 }
0x82F05A1C = { parent = 0x82F054C8 }
0x82F05A30 = { parent = 0x82F054C8 }

# HazingPlayerManager::CreatePlayer (local co-op M2). Reached only through an
# indirect call -- its sole static reference is its own .pdata unwind record --
# so codegen never discovers it and the dispatcher has nothing to look up.
# Listed here so GetFunction(0x8281C678) resolves for the coop_spawn_test probe.
0x8281C678 = {}

[[entrypoint.midasm_hook]]
address = 0x82F33FF4
name = "on_swap"
registers = []
after_instruction = false

# Graphics-device init sub_82B01C40 sets D3DPRESENT_PARAMETERS.PresentationInterval
# from the LITERAL li r10,2 @ 0x82B01E64 (D3DPRESENT_INTERVAL_TWO -- the 30fps cap
# the retail X360 build ships with; the engine's max-fps cvar is dead on this
# build). Hook after the li and rewrite r10=1 when the opt-in 60fps unlock is on.
# Hook the STORE (stw r10,0x1C0(r31) @ 0x82B01EBC), not the li @ 0x82B01E64 --
# 0x58 bytes separate them and r10 was reloaded in between: hooking the li fired
# but guest_fps stayed 30.0 (vblank 120Hz M3.131 proved 60 swaps possible, so
# the patched value was simply not the one stored).
[[entrypoint.midasm_hook]]
address = 0x82B01EBC
name = "on_present_interval"
registers = ["r10"]
after_instruction = false

# Deferred-swap builder sub_82F33920 entry: r3 = D3D device. Reads
# PresentationInterval from dev+0x35EC (13804) and schedules the flip that many
# vblanks after the previous one (ISR ring at sub_82F336C8/82F335B0). Forcing
# the field to 1 here hits the exact value the pacer consumes each frame,
# immune to whichever device/Reset path wrote it (the params-block patch above
# fired but did not change pacing -- a second CreateDevice route exists).
[[entrypoint.midasm_hook]]
address = 0x82F33920
name = "on_swap_build"
registers = ["r3"]
after_instruction = false

[[entrypoint.midasm_hook]]
address = 0x8280F4DC
name = "inject_score_bonus"
registers = ["r31"]
after_instruction = true

# DamageableComponent::GetRemainingHitPoints entry. r3 = IDamageable interface
# (component + 32). Called constantly (HUD/AI read HP), so it lets us capture the
# player's damageable for health regen without needing combat (see on_read_hp).
[[entrypoint.midasm_hook]]
address = 0x82A22348
name = "on_read_hp"
registers = ["r3"]
after_instruction = false

# lua_load(L, reader, data, chunkname) entry: r5 = reader data {buf,size},
# r6 = chunk name. Lets us dump every loaded Lua chunk's bytecode to find the
# per-level medal score targets (see on_lua_load). Approach from the lua_mods branch.
[[entrypoint.midasm_hook]]
address = 0x82BB5010
name = "on_lua_load"
registers = ["r5", "r6"]
after_instruction = false

# GradeScore::GetScoreWithGrade(gradeScore, grade) entry (sub_826FAFD8): r3 =
# the current level's GradeScore object. The game queries it per grade to
# evaluate medals, so this captures the active medal thresholds for the overlay.
[[entrypoint.midasm_hook]]
address = 0x826FAFD8
name = "on_grade_query"
registers = ["r3"]
after_instruction = false

# UnlockableManager::GetUnlockable(manager, id) entry (sub_826F5648): r3 =
# UnlockableManager. Captured so the unlock_all cvar can call UnlockAllUnlockables.
[[entrypoint.midasm_hook]]
address = 0x826F5648
name = "on_get_unlockable"
registers = ["r3"]
after_instruction = false

[[entrypoint.midasm_hook]]
address = 0x82f47dd4
name = "on_ctx_reg_header"
registers = ["r10"]
after_instruction = false

[[entrypoint.midasm_hook]]
address = 0x82f47de4
name = "on_ctx_reg_data"
registers = ["r10"]
after_instruction = false

[[entrypoint.midasm_hook]]
address = 0x82f47768
name = "on_ctx_reg_header"
registers = ["r10"]
after_instruction = false

[[entrypoint.midasm_hook]]
address = 0x82f47778
name = "on_ctx_reg_data"
registers = ["r10"]
after_instruction = false

# --- Title sky / background recolor (ported from the NaughtyBear_ReStuff fork) --
# SetBackgroundColor GAS tag Execute (sub_82CD17B0) entry. r3 = the 8-byte tag
# object; bytes +5/+6/+7 are R/G/B. Lets on_set_bg_color rewrite the title's
# yellow background color to blue (the main menu already uses blue).
[[entrypoint.midasm_hook]]
address = 0x82CD17B0
name = "on_set_bg_color"
registers = ["r3"]
after_instruction = false

# Char-id store in the PlaceObject2/3 parser (stw r5,0x50(r29)). r29 = the record,
# r31 = the parser stream (identifies the movie being parsed); fires for every
# placement. on_gfx_place buffers/recolors the felt sky records, scoped to the
# startmenu movie via the sky_trigger_cid confirmation.
[[entrypoint.midasm_hook]]
address = 0x82CD682C
name = "on_gfx_place"
registers = ["r29", "r31"]
after_instruction = true

# After the SWF PlaceObject2/3 cxform read (bl sub_82D273F8). r29 = the record,
# r31 = the parser stream. Re-applies the sky override after a supplied cxform
# overwrites the record's cxform field.
[[entrypoint.midasm_hook]]
address = 0x82CD6868
name = "on_gfx_cxform"
registers = ["r29", "r31"]
after_instruction = true

# GFxPlaceObject2::Execute entry (sub_82CD1538). r3 = the tag. LOG-ONLY
# (sky_recolor_debug) -- diagnosis of which sky tags replay at runtime.
[[entrypoint.midasm_hook]]
address = 0x82CD1538
name = "on_gfx_execute"
registers = ["r3"]
after_instruction = false

# GASColor::setRGB tail (sub_82C88130), after the 8-float cxform write into the
# character (+44), before the dirty-notify bctrl. r30 = the character. Catches
# runtime AS re-tints of the sky (the menu->Back yellow flash).
[[entrypoint.midasm_hook]]
address = 0x82C88274
name = "on_as_setrgb"
registers = ["r30"]
after_instruction = false

# GASColor::setTransform tail (sub_82C87B38), same contract; r26 = the character.
[[entrypoint.midasm_hook]]
address = 0x82C87DF4
name = "on_as_settransform"
registers = ["r26"]
after_instruction = false

# --- Native score row in the objective panel (ported from the fork) -----------
# The in-level objective panel is a set of GFx invokes on the NBPlayerHud movie
# (singleton at 0x8332F5E0): ClearObjectiveBox / AddObjective / SetObjectiveText
# / SetObjectiveState. The campaign refresh (sub_8271A038) rebuilds rows as
# Clear + AddObjective per revealed objective, then updates rows positionally.
# We bookkeep the box through the wrapper entries and append our own score row
# after each rebuild (see update_score_objective in hooks.cpp).

# hazingHud ClearObjectiveBox invoke wrapper entry. The box was emptied: any
# appended score row is gone; reset the row bookkeeping.
[[entrypoint.midasm_hook]]
address = 0x82706150
name = "on_objbox_clear"
registers = []
after_instruction = false

# hazingHud AddObjective invoke wrapper entry. r3 = hud manager, r4 = row text.
# Counts game-added rows (our own appends are flagged and skipped).
[[entrypoint.midasm_hook]]
address = 0x827060B8
name = "on_objbox_add"
registers = ["r3", "r4"]
after_instruction = false

# ObjectiveMonitorManager campaign refresh (sub_8271A038) entry: marks the
# rebuild in flight so the score row isn't touched mid-refresh. r3 = manager.
[[entrypoint.midasm_hook]]
address = 0x8271A038
name = "on_obj_refresh_begin"
registers = ["r3"]
after_instruction = false

# Campaign refresh common tail (stb r23,0x1C(r22) -- the dirty flags being
# cleared; every exit passes through here). The box is fully rebuilt at this
# point, so this is the one safe, race-free spot to (re)append the score row.
[[entrypoint.midasm_hook]]
address = 0x8271A588
name = "on_obj_refresh_end"
registers = []
after_instruction = true

# --- Bear-action PIP banner pronouns (ported from the fork) -------------------
# hazingHud SetPIPString invoke wrapper entry (the native bear-action banner
# text, e.g. "CUDDLES IS OOFING HIMSELF"). r3 = hud manager, r4 = the final
# banner cstring. on_pip_string rewrites pronoun words per the bearcam_pronouns
# map (redirecting r4 to a scratch copy) so the pronoun override applies to the
# NATIVE cutaway too, not just the mode-2 card.
[[entrypoint.midasm_hook]]
address = 0x827068D0
name = "on_pip_string"
registers = ["r3", "r4"]
after_instruction = false

# hazingHud SetPIPNPCName invoke wrapper entry. r4 = the PIP window's NPC
# display name ("CUDDLES"). Captured as the pronoun-match fallback for banner
# lines that don't repeat the bear's name.
[[entrypoint.midasm_hook]]
address = 0x82706A60
name = "on_pip_npcname"
registers = ["r4"]
after_instruction = false

# --- Free camera (ported from the fork) --------------------------------------
# hg::Camera per-frame update entry (sub_82B07720, found by tracing
# UpdateViewMatrix's non-SWIG callers). r4 = the pointer to the new camera
# matrix the follow system computed this frame, about to be pushed via
# UpdateViewMatrix (called internally, later in this same function).
# on_camera_update substitutes r4 with the free camera's own matrix while
# active, leaving everything else in the function (dirty flag, current-
# camera bookkeeping, frustum-related calls) completely unmodified.
[[entrypoint.midasm_hook]]
address = 0x82B07720
name = "on_camera_update"
registers = ["r4"]
after_instruction = false
